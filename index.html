<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BlueBot</title>
  <link rel="stylesheet" href="index.bd810733.css">
  <style>
    body {
      background-color: #e0f7fa; /* 밝은 하늘색 배경 */
    }
    header {
      background: linear-gradient(to right, #2196f3, #42a5f5, #64b5f6); /* 푸른 그라데이션 */
      color: white;
    }
    #new-chat-btn {
      background-color: #ffffff;
      color: #1e88e5;
      transition: background-color 0.3s ease, color 0.3s ease;
    }
    #new-chat-btn:hover {
      background-color: #e3f2fd;
      color: #1565c0;
    }
    #chat-container {
      background-color: #bbdefb; /* 채팅 영역 배경 */
      padding: 20px;
    }
    footer {
      background-color: #ffffff;
      border-top: 1px solid #90caf9;
    }
    #user-input {
      border: 1px solid #90caf9;
      transition: border-color 0.3s ease;
    }
    #user-input:focus {
      border-color: #1e88e5;
    }
    #api-selector {
      border: 1px solid #90caf9;
    }
    button[type="submit"] {
      background-color: #1e88e5;
      color: white;
      transition: background-color 0.3s ease;
    }
    button[type="submit"]:hover {
      background-color: #1565c0;
    }
  </style>
</head>
<body class="flex flex-col h-screen">
  <header class="flex items-center justify-between p-4">
    <div class="flex items-center space-x-4">
      <h1 class="font-semibold text-xl">Living in Samsung</h1>
      <button id="new-chat-btn" class="px-3 py-1 rounded">New Chat</button>
    </div>
  </header>
  <main id="chat-container" class="chat-scroll flex-1 overflow-y-auto">
  </main>
  <footer class="p-4">
    <form id="message-form" class="flex items-center space-x-2">
      <input type="text" id="user-input" class="flex-1 p-2 rounded-md" placeholder="Type your message..." required>
      <select id="api-selector" class="p-2 rounded-md">
        <option value="naive" selected>Naive</option>
        <option value="assistant">Assistant</option>
      </select>
      <button type="submit" class="px-4 py-2 rounded-md">Send</button>
    </form>
  </footer>
  <script type="module" src="index.d0db93d0.js"></script>
</body>
</html>

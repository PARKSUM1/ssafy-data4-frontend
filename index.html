<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Living in Samsung</title>
    <link rel="stylesheet" href="/index.4d663569.css">
</head>

<body class="h-screen flex flex-col bg-gray-100">
    <!-- Header -->
    <header class="p-4 bg-gradient-to-r from-blue-600 via-blue-500 to-blue-400 text-white flex items-center justify-between">
        <div class="flex items-center space-x-4">
            <h1 class="text-xl font-semibold">Living in Samsung</h1>
        </div>
        <button id="new-chat-btn" class="bg-white text-blue-600 px-4 py-2 rounded hover:bg-blue-100 transition">
            New Chat
        </button>
    </header>

    <!-- Main chat area -->
    <main id="chat-container" class="flex-1 overflow-y-auto p-4 chat-scroll">
        <!-- Messages will be dynamically inserted here -->
    </main>

    <!-- Input area with endpoint selector -->
    <footer class="border-t border-gray-300 bg-white p-4">
        <form id="message-form" class="flex items-center space-x-2">
            <input type="text" id="user-input" class="flex-1 border border-gray-300 rounded-md p-2 outline-none focus:border-blue-500" placeholder="Type your message..." required="">
            <select id="api-selector" class="border border-gray-300 rounded-md p-2">
                <option value="naive" selected="">Naive (/chat)</option>
                <option value="assistant">Assistant (/assistant)</option>
            </select>
            <button type="submit" class="bg-blue-600 text-white px-4 py-2 rounded-md hover:bg-blue-700 transition">
                Send
            </button>
        </form>
    </footer>

    <script src="/index.0641b553.js" defer=""></script>
</body>

</html>
